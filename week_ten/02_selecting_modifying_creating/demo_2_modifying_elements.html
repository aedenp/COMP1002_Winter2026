<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOM Demo 2 – Modifying Elements (Student)</title>
<style>
body{font-family:Arial;margin:40px;background:#f5f7fb}
section{background:white;padding:20px;border-radius:10px;max-width:800px}
button{padding:8px 12px;margin:6px}
</style>
</head>
<body>

<section>
    <h1 id="heading">Original Heading</h1>
    <p id="message">This paragraph will change.</p>

    <button id="text-btn">Change Text</button>
    <button id="style-btn">Change Style</button>

</section>

<script>
//select the elements once and store references in variables
let heading = document.querySelector('#heading');
let message = document.querySelector('#message');
let textBtn = document.querySelector('#text-btn');
let styleBtn = document.querySelector('#style-btn');

//change the text content of the heading and message when the text button is clicked
textBtn.addEventListener('click', function() {
    //modify the elements - modify text and HTML content
    heading.textContent = 'The heading has been changed';
    message.innerHTML = 'The <strong>paragraph</strong> has also been changed';
});

//change the style of the heading and message when the style button is clicked
styleBtn.addEventListener('click', function() {
    heading.style.color = '#450';
    heading.style.backgrounfColor = '#ff0';
    heading.style.padding = '10px';
});

//change styles of messages with the style property
styleBtn.addEventListener('click', function() {

message.style.color = '#450';
message.style.backgroundColor = '#eee';
message.style.padding = '10px'; 

});

</script>

</body>
</html>
